let m;if(ply<4){const l=e.moves();m=l[(Math.random()*l.length)|0]}else m=turn===ours?e.ai(W,.03):fromUci(e,r.mv);
if(m==null||m<0)break;e.make(m)}
const win=res.includes("checkmate")?(res[0]==="W"?1:-1):0;
sn.push(Int8Array.from(e.B));tg.push(win);
const n=sn.length,BS=new Int8Array(n*64);sn.forEach((b,i)=>BS.set(b,i*64));
err=.95*err+.05*e.trainT(W,BS,n,tg,LR);st.pos+=n;
const sc=win*ours;st.g++;sc>0?st.w++:sc<0?st.l++:st.d++;recent.push(sc);
if(recent.length>=20){last=recent.reduce((x,y)=>x+y)/20;recent=[];if(last>.2&&lvl<20){lvl++;sfs.forEach(s=>s.set("Skill Level",lvl))}}
if(st.g%10===0)save()}}finally{busy[k]=false}}
async function start(){if(run)return;run=true;$("go").textContent="Pause";note("");
if(!sfs.length){try{for(let k=0;k<K;k++){const o=mk($("sf").value);sfs.push(o);await o.init();o.set("Skill Level",lvl)}}catch(e){note("Stockfish failed to start.");run=false;$("go").textContent="Start";sfs=[];return}}
for(let k=0;k<K;k++)slot(k)}
$("go").onclick=()=>{if(run){run=false;$("go").textContent="Start"}else start()};
$("rs").onclick=()=>{W=rnd();st={g:0,w:0,d:0,l:0,pos:0};recent=[];last=0;err=.5;save()};
const C=[["g","games vs Stockfish"],["wdl","our AI: wins / draws / losses"],["lv","Stockfish skill level (0 to 20)"],["rc","our score, last 20 games (-1 to 1)"],["er","eval error vs Stockfish (lower is better)"],["ps","positions learned from"]];
$("cards").innerHTML=C.map(([i,t])=>`<div class="c"><b id="${i}">0</b><span>${t}</span></div>`).join("");
setInterval(()=>{$("g").textContent=st.g;$("wdl").textContent=st.w+" / "+st.d+" / "+st.l;$("lv").textContent=lvl;$("rc").textContent=last.toFixed(2);$("er").textContent=err.toFixed(3);$("ps").textContent=st.pos.toLocaleString();
const p=E0.pv(W,1);$("vals").textContent=p<.02?"still discovering what a pawn is worth":"knight "+(E0.pv(W,2)/p).toFixed(1)+", bishop "+(E0.pv(W,3)/p).toFixed(1)+", rook "+(E0.pv(W,4)/p).toFixed(1)+", queen "+(E0.pv(W,5)/p).toFixed(1)},1000);
